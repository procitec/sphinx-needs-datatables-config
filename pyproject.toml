[project]
name = "sphinx-needs-datatables-config"
version = "0.2.1"
description = "Configurable DataTables initialization for Sphinx-Needs tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sphinx>=8,<10",
    "sphinx-needs>=8,<9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*BuildEnvironment\\.app.*:sphinx.deprecation.RemovedInSphinx11Warning:sphinx_needs\\..*",
    "ignore:The frontend\\.OptionParser class will be replaced.*:DeprecationWarning:sphinx_needs\\.layout",
    "ignore:The frontend\\.Option class will be removed.*:DeprecationWarning:optparse",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
